  <!-- ================= LOGIC & RANDOMIZER ENGINE ================= -->
  <script>
    const SITE_BASE_URL = "https://daily-practice-sheets-dpps.smaphysics.com";

    function toggleDarkMode() {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('sma-theme', 'light');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('sma-theme', 'dark');
      }
    }

    function toggleMobilePalette(show) {
      const modal = document.getElementById("mobile-palette-modal");
      if (show) {
        modal.classList.remove("hidden");
      } else {
        modal.classList.add("hidden");
      }
    }

    function slugify(text) {
      return text.toString().toLowerCase().trim().replace(/[^a-z0-9\s-]/g, '').replace(/[\s_-]+/g, '-');
    }

    function formatMultilineText(rawText) {
      if (!rawText) return "";
      const text = rawText.toString().trim();
      
      if (text.includes("<p>") || text.includes("<br")) {
        return text;
      }

      const paragraphs = text.split(/\n\s*\n/);
      if (paragraphs.length > 1) {
        return paragraphs.map(p => `<p>${p.replace(/\n/g, '<br/>')}</p>`).join("");
      }

      return text.replace(/\n/g, '<br/>');
    }

    // Clones array so original data is never mutated
    function shuffleArray(arr) {
      const cloned = [...arr];
      for (let i = cloned.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
      }
      return cloned;
    }

    // Immune to LaTeX, spaces, duplicates, and case-sensitivity
    function randomizeQuiz(rawQuestions) {
      const shuffledQuestions = shuffleArray(rawQuestions);

      return shuffledQuestions.map((q) => {
        const rawTargetKey = (q.correct || "").toString().trim().toUpperCase().replace(/[^A-Z0-9]/g, '');

        // Tag each option object with an immutable `isCorrect` flag
        const taggedOptions = (q.options || []).map((opt, idx) => {
          const optKeyClean = (opt.key || String.fromCharCode(65 + idx)).toString().trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
          const isCorrect = (optKeyClean === rawTargetKey) || (String(idx + 1) === rawTargetKey);
          return {
            text: opt.text,
            isCorrect: isCorrect
          };
        });

        // Shuffle the option objects
        const shuffledOptionObjects = shuffleArray(taggedOptions);

        // Assign clean sequential keys and find the new correct key
        let newCorrectKey = "A";
        const remappedOptions = shuffledOptionObjects.map((opt, idx) => {
          const newKey = String.fromCharCode(65 + idx);
          if (opt.isCorrect) {
            newCorrectKey = newKey;
          }
          return {
            key: newKey,
            text: opt.text,
            isCorrect: opt.isCorrect
          };
        });

        return {
          ...q,
          options: remappedOptions,
          correct: newCorrectKey
        };
      });
    }

    let questions = [];
    let currentIdx = 0;
    let userSelections = [];
    let submittedStatus = [];
    let totalSeconds = 0;

    document.addEventListener("DOMContentLoaded", async () => {
      initTimer();

      try {
        const manifestRes = await fetch('/daily-dpps.json');
        if (!manifestRes.ok) throw new Error("Could not load /daily-dpps.json");
        const dppList = await manifestRes.json();
        if (!dppList || dppList.length === 0) throw new Error("Manifest file is empty");

        const pathParts = window.location.pathname.split("/").filter(Boolean);
        const practiceIdx = pathParts.indexOf("practice");
        
        let urlSlug = "";
        if (practiceIdx !== -1 && pathParts[practiceIdx + 1]) {
          urlSlug = decodeURIComponent(pathParts[practiceIdx + 1]).trim();
        } else if (window.location.hash) {
          urlSlug = decodeURIComponent(window.location.hash.replace("#", "")).trim();
        }

        let matchedDpp = null;
        if (urlSlug) {
          matchedDpp = dppList.find(item => {
            const itemSlug = slugify(item.title);
            const itemId = item.id ? slugify(item.id) : "";
            return itemSlug === urlSlug || itemId === urlSlug;
          });
        }

        if (!matchedDpp) {
          matchedDpp = dppList[0];
        }

        let rawPath = matchedDpp.jsonFile || matchedDpp.file;
        const jsonPath = rawPath.startsWith('/') ? rawPath : `/${rawPath}`;

        const response = await fetch(jsonPath);
        if (!response.ok) throw new Error(`Could not load dataset at ${jsonPath}`);
        const data = await response.json();

        // Randomize questions & options with boolean-tracked keys
        questions = randomizeQuiz(data.questions || []);

        if (data.meta && data.meta.title) {
          document.getElementById("dpp-meta-title").innerText = data.meta.title;
        }

        const currentTopicSlug = slugify(matchedDpp.title);
        const practiceCanonical = `${SITE_BASE_URL}/practice/${currentTopicSlug}`;
        document.getElementById("practice-seo-canonical")?.setAttribute("href", practiceCanonical);
        document.getElementById("og-practice-url")?.setAttribute("content", practiceCanonical);

        if (data.seo) {
          document.title = data.seo.title;
          document.getElementById("practice-seo-desc")?.setAttribute("content", data.seo.description);
          document.getElementById("og-practice-title")?.setAttribute("content", data.seo.title);
          document.getElementById("og-practice-desc")?.setAttribute("content", data.seo.description);
        }

        userSelections = Array(questions.length).fill(null);
        submittedStatus = Array(questions.length).fill(false);

        initPalette();
        renderQuestion();

      } catch (err) {
        console.error("Error loading DPP:", err);
        document.getElementById("question-statement").innerHTML = `
          <div class="text-rose-700 dark:text-rose-300 bg-rose-50 dark:bg-rose-950/40 p-4 rounded-xl border border-rose-200 dark:border-rose-800 text-xs sm:text-sm">
            <p class="font-bold">Practice set could not be loaded.</p>
            <p class="text-zinc-600 dark:text-zinc-400 mt-0.5">${err.message}</p>
          </div>
        `;
      }
    });

    function initTimer() {
      setInterval(() => {
        totalSeconds++;
        const mins = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
        const secs = String(totalSeconds % 60).padStart(2, '0');
        document.getElementById("timer-display").innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function initPalette() {
      const desktopGrid = document.getElementById("palette-grid-desktop");
      const mobileGrid = document.getElementById("palette-grid-mobile");

      if (desktopGrid) desktopGrid.innerHTML = "";
      if (mobileGrid) mobileGrid.innerHTML = "";

      questions.forEach((_, idx) => {
        if (desktopGrid) {
          const btnD = document.createElement("button");
          btnD.id = `palette-btn-d-${idx}`;
          btnD.innerText = idx + 1;
          btnD.className = "w-full min-h-[40px] py-2 rounded-xl font-bold text-xs border transition flex items-center justify-center bg-zinc-100 dark:bg-zinc-800 border-zinc-200 dark:border-zinc-700 text-zinc-700 dark:text-zinc-300 cursor-pointer";
          btnD.onclick = () => jumpToQuestion(idx);
          desktopGrid.appendChild(btnD);
        }

        if (mobileGrid) {
          const btnM = document.createElement("button");
          btnM.id = `palette-btn-m-${idx}`;
          btnM.innerText = idx + 1;
          btnM.className = "w-full min-h-[44px] py-2.5 rounded-xl font-bold text-xs border transition flex items-center justify-center bg-zinc-100 dark:bg-zinc-800 border-zinc-200 dark:border-zinc-700 text-zinc-700 dark:text-zinc-300 cursor-pointer";
          btnM.onclick = () => {
            jumpToQuestion(idx);
            toggleMobilePalette(false);
          };
          mobileGrid.appendChild(btnM);
        }
      });

      updatePaletteHighlights();
    }

    function renderQuestion() {
      if (!questions || questions.length === 0) return;
      const q = questions[currentIdx];
      
      document.getElementById("question-index-title").innerText = `Question ${currentIdx + 1} of ${questions.length}`;
      document.getElementById("mobile-q-tracker").innerText = `Q ${currentIdx + 1}/${questions.length}`;
      document.getElementById("exam-badge").innerText = q.exam;
      document.getElementById("difficulty-badge").innerText = q.difficulty;
      
      let statementHTML = `<div class="multiline-content break-words leading-relaxed">${formatMultilineText(q.statement)}</div>`;
      if (q.image && q.image.trim() !== "") {
        const imgPath = q.image.startsWith('/') ? q.image : `/${q.image}`;
        statementHTML += `
          <div class="my-3 flex justify-center">
            <img src="${imgPath}" alt="Question Diagram" class="max-h-56 max-w-full rounded-xl border border-zinc-200 dark:border-zinc-700 bg-white p-2 shadow-xs object-contain" />
          </div>
        `;
      }
      document.getElementById("question-statement").innerHTML = statementHTML;
      
      const container = document.getElementById("options-container");
      container.innerHTML = "";
      
      const isSubmitted = submittedStatus[currentIdx];
      const savedSelection = userSelections[currentIdx];

      q.options.forEach((opt) => {
        const btn = document.createElement("button");
        btn.className = "w-full min-h-[48px] sm:min-h-[52px] flex items-start gap-3 p-3 sm:p-4 text-left border rounded-xl sm:rounded-2xl text-xs sm:text-base transition-all cursor-pointer min-w-0 ";
        
        if (isSubmitted) {
          btn.style.pointerEvents = "none";
          if (opt.key === q.correct) {
            btn.className += "border-emerald-500 bg-emerald-50/80 dark:bg-emerald-950/40 text-emerald-950 dark:text-emerald-200 font-semibold";
          } else if (opt.key === savedSelection) {
            btn.className += "border-rose-500 bg-rose-50/80 dark:bg-rose-950/40 text-rose-950 dark:text-rose-200 font-medium";
          } else {
            btn.className += "border-zinc-200 dark:border-zinc-800 text-zinc-400 dark:text-zinc-600 bg-white dark:bg-zinc-900 opacity-60";
          }
        } else {
          if (opt.key === savedSelection) {
            btn.className += "border-indigo-600 bg-indigo-50/80 dark:bg-indigo-950/50 text-indigo-950 dark:text-indigo-200 font-semibold ring-2 ring-indigo-600";
          } else {
            btn.className += "border-zinc-200 dark:border-zinc-800 hover:bg-zinc-50 dark:hover:bg-zinc-800/60 hover:border-zinc-300 dark:hover:border-zinc-700 text-zinc-800 dark:text-zinc-200 bg-white dark:bg-zinc-900";
          }
          btn.onclick = () => selectOption(opt.key);
        }

        btn.innerHTML = `
          <span class="w-6 h-6 sm:w-7 sm:h-7 rounded-md bg-zinc-100 dark:bg-zinc-800 flex items-center justify-center text-[11px] sm:text-xs font-bold text-zinc-700 dark:text-zinc-300 shrink-0 border border-zinc-200 dark:border-zinc-700 mt-0.5">
            ${opt.key}
          </span>
          <div class="flex-1 min-w-0 multiline-content break-words [overflow-wrap:anywhere]">${formatMultilineText(opt.text)}</div>
        `;
        container.appendChild(btn);
      });

      const drawer = document.getElementById("solution-drawer");
      const actionBtn = document.getElementById("action-btn");
      
      if (isSubmitted) {
        document.getElementById("solution-text").innerHTML = formatMultilineText(q.solution);
        drawer.classList.remove("hidden");
        actionBtn.innerText = "Solution Displayed";
        actionBtn.disabled = true;
      } else {
        drawer.classList.add("hidden");
        actionBtn.innerText = "Submit Answer";
        actionBtn.disabled = savedSelection === null;
      }

      document.getElementById("prev-btn").disabled = currentIdx === 0;
      document.getElementById("next-btn").disabled = currentIdx === questions.length - 1;

      updatePaletteHighlights();
      
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ]
        });
      }
    }

    function selectOption(key) {
      if (submittedStatus[currentIdx]) return;
      userSelections[currentIdx] = key;
      renderQuestion();
    }

    function handleActionButton() {
      if (userSelections[currentIdx] === null) return;
      submittedStatus[currentIdx] = true;
      renderQuestion();
    }

    function navigateQuestion(direction) {
      const nextIdx = currentIdx + direction;
      if (nextIdx >= 0 && nextIdx < questions.length) {
        currentIdx = nextIdx;
        renderQuestion();
      }
    }

    function jumpToQuestion(idx) {
      currentIdx = idx;
      renderQuestion();
    }

    function updatePaletteHighlights() {
      questions.forEach((q, idx) => {
        const btnD = document.getElementById(`palette-btn-d-${idx}`);
        const btnM = document.getElementById(`palette-btn-m-${idx}`);

        [btnD, btnM].forEach(btn => {
          if (!btn) return;

          let baseClass = "w-full py-2 rounded-xl font-bold text-xs border transition flex items-center justify-center cursor-pointer ";
          if (btn === btnM) baseClass = "w-full min-h-[44px] py-2.5 rounded-xl font-bold text-xs border transition flex items-center justify-center cursor-pointer ";

          if (submittedStatus[idx]) {
            if (userSelections[idx] === q.correct) {
              btn.className = baseClass + "bg-emerald-500 border-emerald-600 text-white shadow-xs";
            } else {
              btn.className = baseClass + "bg-rose-500 border-rose-600 text-white shadow-xs";
            }
          } else {
            if (idx === currentIdx) {
              btn.className = baseClass + "bg-indigo-50 dark:bg-indigo-950 border-indigo-600 text-indigo-700 dark:text-indigo-300 ring-2 ring-indigo-600 shadow-xs";
            } else {
              btn.className = baseClass + "bg-zinc-100 dark:bg-zinc-800 border-zinc-200 dark:border-zinc-700 text-zinc-700 dark:text-zinc-300 hover:bg-zinc-200 dark:hover:bg-zinc-700";
            }
          }
        });
      });
    }
  </script>

</body>
</html>
