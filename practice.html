<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- Dynamic SEO Meta Tags -->
  <title id="practice-seo-title">SMA Physics — CBT Practice Room</title>
  <meta name="description" id="practice-seo-desc" content="Solve timed NEET and JEE Main/Advanced physics practice questions with detailed LaTeX step-by-step solutions." />
  <meta name="robots" content="index, follow" />
  
  <meta property="og:title" id="og-practice-title" content="SMA Physics — CBT Practice Room" />
  <meta property="og:description" id="og-practice-desc" content="Timed NEET & JEE practice problems with immediate derivations." />
  <meta property="og:type" content="website" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- KaTeX for Math Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head>
<body class="bg-zinc-50 text-zinc-900 font-sans antialiased min-h-screen flex flex-col selection:bg-indigo-600 selection:text-white">

  <!-- ================= TOP HEADER ================= -->
  <header class="bg-white border-b border-zinc-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 h-14 flex items-center justify-between">
      
      <a href="index.html" class="flex items-center gap-2 group">
        <div class="w-7 h-7 rounded bg-indigo-600 flex items-center justify-center text-white font-black text-xs group-hover:bg-indigo-700 transition">
          SMA
        </div>
        <span class="font-bold text-sm tracking-tight text-zinc-800 hidden sm:inline group-hover:text-indigo-600 transition">
          SMA Physics
        </span>
      </a>
      
      <div class="text-center">
        <span id="dpp-meta-title" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-md border border-indigo-100">
          Loading Practice Set...
        </span>
      </div>

      <div class="flex items-center gap-1.5 font-mono text-sm font-semibold bg-zinc-100 px-3 py-1 rounded-full text-zinc-700 border border-zinc-200">
        <svg class="w-4 h-4 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span id="timer-display">00:00</span>
      </div>

    </div>
  </header>

  <!-- ================= MAIN TEST CONTAINER ================= -->
  <main class="max-w-5xl mx-auto px-4 py-6 flex-1 w-full grid grid-cols-1 md:grid-cols-12 gap-6 items-start">
    
    <!-- Left Problem Panel -->
    <div class="md:col-span-8 bg-white border border-zinc-200 rounded-2xl p-5 sm:p-7 shadow-sm space-y-6">
      
      <div class="flex items-center justify-between border-b border-zinc-100 pb-3.5">
        <span class="text-xs font-bold text-zinc-400 uppercase tracking-wider" id="question-index-title">
          Question 1
        </span>
        <div class="flex items-center gap-2">
          <span class="px-2 py-0.5 text-[11px] font-bold rounded bg-blue-50 text-blue-700 border border-blue-200" id="exam-badge">
            JEE / NEET
          </span>
          <span class="px-2 py-0.5 text-[11px] font-bold rounded bg-amber-50 text-amber-700 border border-amber-200" id="difficulty-badge">
            Level 1
          </span>
        </div>
      </div>

      <!-- Question Statement + Dynamic Diagram Image -->
      <div class="text-zinc-900 text-base md:text-lg leading-relaxed font-normal" id="question-statement"></div>

      <!-- Options -->
      <div class="space-y-3" id="options-container"></div>

      <!-- Solution Drawer -->
      <div id="solution-drawer" class="hidden bg-zinc-50 border-t border-dashed border-zinc-200 rounded-xl p-5 space-y-3">
        <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 text-[11px] font-bold bg-indigo-50 text-indigo-700 border border-indigo-100 rounded">
          <span>✓</span>
          <span>SMA Step-by-Step Derivation</span>
        </div>
        <div class="text-sm text-zinc-700 leading-relaxed space-y-2" id="solution-text"></div>
      </div>

      <!-- Action Navigation Controls -->
      <div class="flex items-center justify-between pt-4 border-t border-zinc-100">
        <button id="prev-btn" onclick="navigateQuestion(-1)" class="px-4 py-2 text-xs font-semibold text-zinc-600 hover:bg-zinc-100 rounded-xl border border-zinc-200 disabled:opacity-40 disabled:pointer-events-none transition cursor-pointer">
          ← Previous
        </button>
        <button id="action-btn" onclick="handleActionButton()" class="px-6 py-2.5 text-xs font-bold text-white bg-zinc-900 hover:bg-zinc-800 rounded-xl shadow-sm transition disabled:opacity-40 disabled:pointer-events-none cursor-pointer">
          Submit Answer
        </button>
        <button id="next-btn" onclick="navigateQuestion(1)" class="px-4 py-2 text-xs font-semibold text-zinc-600 hover:bg-zinc-100 rounded-xl border border-zinc-200 disabled:opacity-40 disabled:pointer-events-none transition cursor-pointer">
          Next →
        </button>
      </div>

    </div>

    <!-- Right Navigation Matrix -->
    <div class="md:col-span-4 bg-white border border-zinc-200 rounded-2xl p-5 shadow-sm space-y-5">
      <div>
        <h3 class="text-sm font-bold text-zinc-900 tracking-tight">Question Navigation Matrix</h3>
        <p class="text-xs text-zinc-400 mt-0.5">Click any number to jump directly</p>
      </div>
      
      <div class="grid grid-cols-5 gap-2" id="palette-grid"></div>

      <div class="pt-4 border-t border-zinc-100 space-y-2.5 text-xs font-medium text-zinc-500">
        <div class="flex items-center gap-2.5">
          <div class="w-3.5 h-3.5 rounded bg-zinc-100 border border-zinc-300"></div>
          <span>Unvisited</span>
        </div>
        <div class="flex items-center gap-2.5">
          <div class="w-3.5 h-3.5 rounded bg-indigo-50 border border-indigo-600 ring-1 ring-indigo-600"></div>
          <span>Current Active</span>
        </div>
        <div class="flex items-center gap-2.5">
          <div class="w-3.5 h-3.5 rounded bg-emerald-500 border border-emerald-600"></div>
          <span>Correct Answer</span>
        </div>
        <div class="flex items-center gap-2.5">
          <div class="w-3.5 h-3.5 rounded bg-rose-500 border border-rose-600"></div>
          <span>Incorrect Answer</span>
        </div>
      </div>
    </div>

  </main>

  <!-- ================= LOGIC & SEO SCRIPT ================= -->
  <script>
    let questions = [];
    let currentIdx = 0;
    let userSelections = [];
    let submittedStatus = [];
    let totalSeconds = 0;

    document.addEventListener("DOMContentLoaded", async () => {
      initTimer();

      const urlParams = new URLSearchParams(window.location.search);
      let targetFile = urlParams.get('file');

      if (!targetFile) {
        try {
          const manifestRes = await fetch('./daily-dpps.json');
          const dppList = await manifestRes.json();
          if (dppList && dppList.length > 0) {
            targetFile = dppList[0].jsonFile || dppList[0].file;
          }
        } catch (e) {
          targetFile = 'dpps/dpp-42/dpp-42.json';
        }
      }

      try {
        const response = await fetch(targetFile);
        const data = await response.json();
        
        questions = data.questions;
        if (data.meta && data.meta.title) {
          document.getElementById("dpp-meta-title").innerText = data.meta.title;
        }

        // Apply SEO tags dynamically to practice room
        if (data.seo) {
          document.title = data.seo.title;
          document.getElementById("practice-seo-desc").setAttribute("content", data.seo.description);
          document.getElementById("og-practice-title").setAttribute("content", data.seo.title);
          document.getElementById("og-practice-desc").setAttribute("content", data.seo.description);
        }

        userSelections = Array(questions.length).fill(null);
        submittedStatus = Array(questions.length).fill(false);

        initPalette();
        renderQuestion();
      } catch (err) {
        console.error("Error loading DPP JSON:", err);
        document.getElementById("question-statement").innerText = "Failed to load practice questions. Please verify your data files.";
      }
    });

    function initTimer() {
      setInterval(() => {
        totalSeconds++;
        const mins = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
        const secs = String(totalSeconds % 60).padStart(2, '0');
        document.getElementById("timer-display").innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function initPalette() {
      const grid = document.getElementById("palette-grid");
      grid.innerHTML = "";
      questions.forEach((_, idx) => {
        const btn = document.createElement("button");
        btn.id = `palette-btn-${idx}`;
        btn.innerText = idx + 1;
        btn.className = "w-full py-2.5 rounded-xl font-bold text-xs border transition flex items-center justify-center bg-zinc-100 border-zinc-300 text-zinc-700 cursor-pointer";
        btn.onclick = () => jumpToQuestion(idx);
        grid.appendChild(btn);
      });
      updatePaletteHighlights();
    }

    function renderQuestion() {
      if (!questions || questions.length === 0) return;
      const q = questions[currentIdx];
      
      document.getElementById("question-index-title").innerText = `Question ${currentIdx + 1} of ${questions.length}`;
      document.getElementById("exam-badge").innerText = q.exam;
      document.getElementById("difficulty-badge").innerText = q.difficulty;
      
      // Question Text + Image Diagram Support
      let statementHTML = `<div>${q.statement}</div>`;
      if (q.image && q.image.trim() !== "") {
        statementHTML += `
          <div class="my-4 flex justify-center">
            <img src="${q.image}" alt="Physics Question Diagram" class="max-h-60 max-w-full rounded-lg border border-zinc-200 bg-white p-2 shadow-xs object-contain" />
          </div>
        `;
      }
      document.getElementById("question-statement").innerHTML = statementHTML;
      
      const container = document.getElementById("options-container");
      container.innerHTML = "";
      
      const isSubmitted = submittedStatus[currentIdx];
      const savedSelection = userSelections[currentIdx];

      q.options.forEach((opt) => {
        const btn = document.createElement("button");
        btn.className = "w-full flex items-center gap-3.5 p-4 text-left border rounded-xl text-sm transition-all cursor-pointer ";
        
        if (isSubmitted) {
          btn.style.pointerEvents = "none";
          if (opt.key === q.correct) {
            btn.className += "border-emerald-500 bg-emerald-50/70 text-emerald-950 font-semibold";
          } else if (opt.key === savedSelection) {
            btn.className += "border-rose-500 bg-rose-50/70 text-rose-950 font-medium";
          } else {
            btn.className += "border-zinc-200 text-zinc-400 bg-white opacity-60";
          }
        } else {
          if (opt.key === savedSelection) {
            btn.className += "border-indigo-600 bg-indigo-50/60 text-indigo-950 font-medium ring-1 ring-indigo-600";
          } else {
            btn.className += "border-zinc-200 hover:bg-zinc-50 hover:border-zinc-300 text-zinc-800 bg-white";
          }
          btn.onclick = () => selectOption(opt.key);
        }

        btn.innerHTML = `
          <span class="w-6 h-6 rounded-md bg-zinc-100 flex items-center justify-center text-xs font-bold text-zinc-600 shrink-0 border border-zinc-200">
            ${opt.key}
          </span>
          <div class="flex-1">${opt.text}</div>
        `;
        container.appendChild(btn);
      });

      const drawer = document.getElementById("solution-drawer");
      const actionBtn = document.getElementById("action-btn");
      
      if (isSubmitted) {
        document.getElementById("solution-text").innerHTML = q.solution;
        drawer.classList.remove("hidden");
        actionBtn.innerText = "Solution Displayed";
        actionBtn.disabled = true;
      } else {
        drawer.classList.add("hidden");
        actionBtn.innerText = "Submit Answer";
        actionBtn.disabled = savedSelection === null;
      }

      document.getElementById("prev-btn").disabled = currentIdx === 0;
      document.getElementById("next-btn").disabled = currentIdx === questions.length - 1;

      updatePaletteHighlights();
      
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ]
        });
      }
    }

    function selectOption(key) {
      if (submittedStatus[currentIdx]) return;
      userSelections[currentIdx] = key;
      renderQuestion();
    }

    function handleActionButton() {
      if (userSelections[currentIdx] === null) return;
      submittedStatus[currentIdx] = true;
      renderQuestion();
    }

    function navigateQuestion(direction) {
      const nextIdx = currentIdx + direction;
      if (nextIdx >= 0 && nextIdx < questions.length) {
        currentIdx = nextIdx;
        renderQuestion();
      }
    }

    function jumpToQuestion(idx) {
      currentIdx = idx;
      renderQuestion();
    }

    function updatePaletteHighlights() {
      questions.forEach((q, idx) => {
        const btn = document.getElementById(`palette-btn-${idx}`);
        if (!btn) return;

        btn.className = "w-full py-2.5 rounded-xl font-bold text-xs border transition flex items-center justify-center cursor-pointer ";

        if (submittedStatus[idx]) {
          if (userSelections[idx] === q.correct) {
            btn.className += "bg-emerald-500 border-emerald-600 text-white shadow-sm";
          } else {
            btn.className += "bg-rose-500 border-rose-600 text-white shadow-sm";
          }
        } else {
          if (idx === currentIdx) {
            btn.className += "bg-indigo-50 border-indigo-600 text-indigo-700 ring-2 ring-indigo-600 shadow-sm";
          } else {
            btn.className += "bg-zinc-100 border-zinc-200 text-zinc-700 hover:bg-zinc-200";
          }
        }
      });
    }
  </script>

</body>
</html>
