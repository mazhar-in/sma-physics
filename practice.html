<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  
  <title id="practice-seo-title">SMA Physics — CBT Practice Room</title>
  <meta name="description" id="practice-seo-desc" content="Solve timed NEET and JEE Main/Advanced physics practice questions with detailed LaTeX step-by-step solutions." />
  <meta name="author" content="Syed Mazhar Ali" />
  <meta name="robots" content="index, follow" />
  
  <meta property="og:title" id="og-practice-title" content="SMA Physics — CBT Practice Room" />
  <meta property="og:description" id="og-practice-desc" content="Timed NEET & JEE practice problems with immediate derivations." />
  <meta property="og:type" content="website" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- KaTeX for Math Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <style>
    .katex-display {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 0.25rem 0;
      margin: 0.5rem 0 !important;
      -webkit-overflow-scrolling: touch;
    }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900 font-sans antialiased min-h-screen flex flex-col selection:bg-indigo-600 selection:text-white overflow-x-hidden">

  <!-- ================= TOP HEADER ================= -->
  <header class="bg-white border-b border-zinc-200 sticky top-0 z-40 shadow-xs">
    <div class="max-w-5xl mx-auto px-3 sm:px-4 h-14 flex items-center justify-between gap-2">
      
      <!-- Brand & Home Link -->
      <a href="/" class="flex items-center gap-1.5 group shrink-0">
        <div class="w-7 h-7 rounded bg-indigo-600 flex items-center justify-center text-white font-black text-xs group-hover:bg-indigo-700 transition">
          SMA
        </div>
        <span class="font-bold text-xs sm:text-sm tracking-tight text-zinc-800 hidden xs:inline group-hover:text-indigo-600 transition">
          SMA Physics
        </span>
      </a>
      
      <!-- Topic Header Title -->
      <div class="min-w-0 text-center px-1 flex-1">
        <span id="dpp-meta-title" class="text-[11px] sm:text-xs font-bold text-indigo-600 bg-indigo-50 px-2 sm:px-3 py-1 rounded-md border border-indigo-100 truncate max-w-full inline-block align-middle">
          Loading Practice Set...
        </span>
      </div>

      <!-- Live Test Timer -->
      <div class="flex items-center gap-1 font-mono text-xs sm:text-sm font-semibold bg-zinc-100 px-2 sm:px-2.5 py-1 rounded-full text-zinc-700 border border-zinc-200 shrink-0">
        <svg class="w-3.5 h-3.5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span id="timer-display">00:00</span>
      </div>

    </div>
  </header>

  <!-- ================= MAIN TEST CONTAINER ================= -->
  <main class="max-w-5xl mx-auto px-3 sm:px-4 py-4 sm:py-6 flex-1 w-full grid grid-cols-1 md:grid-cols-12 gap-5 items-start min-w-0">
    
    <!-- Left Problem Panel (8 cols) -->
    <div class="md:col-span-8 bg-white border border-zinc-200 rounded-2xl p-4 sm:p-6 shadow-xs space-y-5 min-w-0">
      
      <div class="flex items-center justify-between border-b border-zinc-100 pb-3 gap-2">
        <span class="text-[11px] sm:text-xs font-bold text-zinc-400 uppercase tracking-wider shrink-0" id="question-index-title">
          Question 1
        </span>
        <div class="flex items-center gap-1.5 shrink-0">
          <span class="px-2 py-0.5 text-[10px] sm:text-[11px] font-bold rounded bg-blue-50 text-blue-700 border border-blue-200" id="exam-badge">
            JEE / NEET
          </span>
          <span class="px-2 py-0.5 text-[10px] sm:text-[11px] font-bold rounded bg-amber-50 text-amber-700 border border-amber-200" id="difficulty-badge">
            Level 1
          </span>
        </div>
      </div>

      <!-- Question Statement + Diagram -->
      <div class="text-zinc-900 text-sm sm:text-base leading-relaxed font-normal break-words [overflow-wrap:anywhere]" id="question-statement">
        <div class="animate-pulse space-y-3 py-1">
          <div class="h-4 bg-zinc-200 rounded w-3/4"></div>
          <div class="h-4 bg-zinc-200 rounded"></div>
        </div>
      </div>

      <!-- Multiple Choice Options -->
      <div class="space-y-2.5 min-w-0" id="options-container"></div>

      <!-- Expandable Solution Drawer -->
      <div id="solution-drawer" class="hidden bg-zinc-50 border-t border-dashed border-zinc-200 rounded-xl p-3.5 sm:p-4 space-y-2.5 min-w-0">
        <div class="inline-flex items-center gap-1.5 px-2 py-0.5 text-[10px] sm:text-[11px] font-bold bg-indigo-50 text-indigo-700 border border-indigo-100 rounded">
          <span>✓</span>
          <span>SMA Step-by-Step Derivation</span>
        </div>
        <div class="text-xs sm:text-sm text-zinc-700 leading-relaxed space-y-2 break-words [overflow-wrap:anywhere]" id="solution-text"></div>
      </div>

      <!-- Navigation Toolbar -->
      <div class="flex items-center justify-between pt-3 border-t border-zinc-100 gap-2">
        <button id="prev-btn" onclick="navigateQuestion(-1)" class="px-3 sm:px-4 py-2 text-xs font-semibold text-zinc-600 hover:bg-zinc-100 rounded-xl border border-zinc-200 disabled:opacity-40 disabled:pointer-events-none transition cursor-pointer shrink-0">
          ← Prev
        </button>
        <button id="action-btn" onclick="handleActionButton()" class="px-4 sm:px-6 py-2 sm:py-2.5 text-xs font-bold text-white bg-zinc-900 hover:bg-zinc-800 rounded-xl shadow-xs transition disabled:opacity-40 disabled:pointer-events-none cursor-pointer flex-1 sm:flex-none text-center truncate">
          Submit Answer
        </button>
        <button id="next-btn" onclick="navigateQuestion(1)" class="px-3 sm:px-4 py-2 text-xs font-semibold text-zinc-600 hover:bg-zinc-100 rounded-xl border border-zinc-200 disabled:opacity-40 disabled:pointer-events-none transition cursor-pointer shrink-0">
          Next →
        </button>
      </div>

    </div>

    <!-- Right Navigation Matrix (4 cols) -->
    <div class="md:col-span-4 bg-white border border-zinc-200 rounded-2xl p-4 sm:p-5 shadow-xs space-y-4 min-w-0">
      <div>
        <h3 class="text-xs sm:text-sm font-bold text-zinc-900 tracking-tight">Question Navigation Matrix</h3>
        <p class="text-[11px] text-zinc-400 mt-0.5">Tap any number to jump directly</p>
      </div>
      
      <!-- 5-Column Responsive Grid -->
      <div class="grid grid-cols-5 gap-1.5 sm:gap-2" id="palette-grid"></div>

      <!-- Legend -->
      <div class="pt-3 border-t border-zinc-100 grid grid-cols-2 gap-2 text-[11px] font-medium text-zinc-500">
        <div class="flex items-center gap-1.5">
          <div class="w-3 h-3 rounded bg-zinc-100 border border-zinc-300 shrink-0"></div>
          <span class="truncate">Unvisited</span>
        </div>
        <div class="flex items-center gap-1.5">
          <div class="w-3 h-3 rounded bg-indigo-50 border border-indigo-600 ring-1 ring-indigo-600 shrink-0"></div>
          <span class="truncate">Current</span>
        </div>
        <div class="flex items-center gap-1.5">
          <div class="w-3 h-3 rounded bg-emerald-500 shrink-0"></div>
          <span class="truncate">Correct</span>
        </div>
        <div class="flex items-center gap-1.5">
          <div class="w-3 h-3 rounded bg-rose-500 shrink-0"></div>
          <span class="truncate">Incorrect</span>
        </div>
      </div>
    </div>

  </main>

  <!-- ================= LOGIC & RESOLVER SCRIPT ================= -->
  <script>
    function slugify(text) {
      return text
        .toString()
        .toLowerCase()
        .trim()
        .replace(/[^a-z0-9\s-]/g, '')
        .replace(/[\s_-]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    let questions = [];
    let currentIdx = 0;
    let userSelections = [];
    let submittedStatus = [];
    let totalSeconds = 0;

    document.addEventListener("DOMContentLoaded", async () => {
      initTimer();

      try {
        const manifestRes = await fetch('/daily-dpps.json');
        if (!manifestRes.ok) throw new Error("Could not load /daily-dpps.json");
        const dppList = await manifestRes.json();
        if (!dppList || dppList.length === 0) throw new Error("Manifest file is empty");

        const pathParts = window.location.pathname.split("/").filter(Boolean);
        const practiceIdx = pathParts.indexOf("practice");
        
        let urlSlug = "";
        if (practiceIdx !== -1 && pathParts[practiceIdx + 1]) {
          urlSlug = decodeURIComponent(pathParts[practiceIdx + 1]).trim();
        } else if (window.location.hash) {
          urlSlug = decodeURIComponent(window.location.hash.replace("#", "")).trim();
        }

        let matchedDpp = null;
        if (urlSlug) {
          matchedDpp = dppList.find(item => {
            const itemSlug = slugify(item.title);
            const itemId = item.id ? slugify(item.id) : "";
            return itemSlug === urlSlug || itemId === urlSlug;
          });
        }

        if (!matchedDpp) {
          matchedDpp = dppList[0];
        }

        let rawPath = matchedDpp.jsonFile || matchedDpp.file;
        const jsonPath = rawPath.startsWith('/') ? rawPath : `/${rawPath}`;

        const response = await fetch(jsonPath);
        if (!response.ok) throw new Error(`Could not load dataset at ${jsonPath}`);
        const data = await response.json();

        questions = data.questions;
        if (data.meta && data.meta.title) {
          document.getElementById("dpp-meta-title").innerText = data.meta.title;
        }

        if (data.seo) {
          document.title = data.seo.title;
          document.getElementById("practice-seo-desc")?.setAttribute("content", data.seo.description);
          document.getElementById("og-practice-title")?.setAttribute("content", data.seo.title);
          document.getElementById("og-practice-desc")?.setAttribute("content", data.seo.description);
        }

        userSelections = Array(questions.length).fill(null);
        submittedStatus = Array(questions.length).fill(false);

        initPalette();
        renderQuestion();

      } catch (err) {
        console.error("Error loading DPP:", err);
        document.getElementById("question-statement").innerHTML = `
          <div class="text-rose-700 bg-rose-50 p-3.5 rounded-xl border border-rose-200">
            <p class="font-bold text-xs sm:text-sm">Practice sheet could not be loaded.</p>
            <p class="text-[11px] text-zinc-600 mt-0.5">${err.message}</p>
          </div>
        `;
      }
    });

    function initTimer() {
      setInterval(() => {
        totalSeconds++;
        const mins = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
        const secs = String(totalSeconds % 60).padStart(2, '0');
        document.getElementById("timer-display").innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function initPalette() {
      const grid = document.getElementById("palette-grid");
      grid.innerHTML = "";
      questions.forEach((_, idx) => {
        const btn = document.createElement("button");
        btn.id = `palette-btn-${idx}`;
        btn.innerText = idx + 1;
        btn.className = "w-full py-2 rounded-lg font-bold text-xs border transition flex items-center justify-center bg-zinc-100 border-zinc-200 text-zinc-700 cursor-pointer";
        btn.onclick = () => jumpToQuestion(idx);
        grid.appendChild(btn);
      });
      updatePaletteHighlights();
    }

    function renderQuestion() {
      if (!questions || questions.length === 0) return;
      const q = questions[currentIdx];
      
      document.getElementById("question-index-title").innerText = `Question ${currentIdx + 1} of ${questions.length}`;
      document.getElementById("exam-badge").innerText = q.exam;
      document.getElementById("difficulty-badge").innerText = q.difficulty;
      
      let statementHTML = `<div class="break-words">${q.statement}</div>`;
      if (q.image && q.image.trim() !== "") {
        const imgPath = q.image.startsWith('/') ? q.image : `/${q.image}`;
        statementHTML += `
          <div class="my-3 flex justify-center">
            <img src="${imgPath}" alt="Physics Question Diagram" class="max-h-52 max-w-full rounded-lg border border-zinc-200 bg-white p-2 shadow-xs object-contain" />
          </div>
        `;
      }
      document.getElementById("question-statement").innerHTML = statementHTML;
      
      const container = document.getElementById("options-container");
      container.innerHTML = "";
      
      const isSubmitted = submittedStatus[currentIdx];
      const savedSelection = userSelections[currentIdx];

      q.options.forEach((opt) => {
        const btn = document.createElement("button");
        btn.className = "w-full flex items-start gap-3 p-3 sm:p-3.5 text-left border rounded-xl text-xs sm:text-sm transition-all cursor-pointer min-w-0 ";
        
        if (isSubmitted) {
          btn.style.pointerEvents = "none";
          if (opt.key === q.correct) {
            btn.className += "border-emerald-500 bg-emerald-50/70 text-emerald-950 font-semibold";
          } else if (opt.key === savedSelection) {
            btn.className += "border-rose-500 bg-rose-50/70 text-rose-950 font-medium";
          } else {
            btn.className += "border-zinc-200 text-zinc-400 bg-white opacity-60";
          }
        } else {
          if (opt.key === savedSelection) {
            btn.className += "border-indigo-600 bg-indigo-50/60 text-indigo-950 font-medium ring-1 ring-indigo-600";
          } else {
            btn.className += "border-zinc-200 hover:bg-zinc-50 hover:border-zinc-300 text-zinc-800 bg-white";
          }
          btn.onclick = () => selectOption(opt.key);
        }

        btn.innerHTML = `
          <span class="w-5 h-5 rounded bg-zinc-100 flex items-center justify-center text-[10px] sm:text-xs font-bold text-zinc-600 shrink-0 border border-zinc-200 mt-0.5">
            ${opt.key}
          </span>
          <div class="flex-1 min-w-0 break-words [overflow-wrap:anywhere]">${opt.text}</div>
        `;
        container.appendChild(btn);
      });

      const drawer = document.getElementById("solution-drawer");
      const actionBtn = document.getElementById("action-btn");
      
      if (isSubmitted) {
        document.getElementById("solution-text").innerHTML = q.solution;
        drawer.classList.remove("hidden");
        actionBtn.innerText = "Solved";
        actionBtn.disabled = true;
      } else {
        drawer.classList.add("hidden");
        actionBtn.innerText = "Submit Answer";
        actionBtn.disabled = savedSelection === null;
      }

      document.getElementById("prev-btn").disabled = currentIdx === 0;
      document.getElementById("next-btn").disabled = currentIdx === questions.length - 1;

      updatePaletteHighlights();
      
      if (window.renderMathInElement) {
        renderMathInElement(document.body, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ]
        });
      }
    }

    function selectOption(key) {
      if (submittedStatus[currentIdx]) return;
      userSelections[currentIdx] = key;
      renderQuestion();
    }

    function handleActionButton() {
      if (userSelections[currentIdx] === null) return;
      submittedStatus[currentIdx] = true;
      renderQuestion();
    }

    function navigateQuestion(direction) {
      const nextIdx = currentIdx + direction;
      if (nextIdx >= 0 && nextIdx < questions.length) {
        currentIdx = nextIdx;
        renderQuestion();
      }
    }

    function jumpToQuestion(idx) {
      currentIdx = idx;
      renderQuestion();
    }

    function updatePaletteHighlights() {
      questions.forEach((q, idx) => {
        const btn = document.getElementById(`palette-btn-${idx}`);
        if (!btn) return;

        btn.className = "w-full py-2 rounded-lg font-bold text-xs border transition flex items-center justify-center cursor-pointer ";

        if (submittedStatus[idx]) {
          if (userSelections[idx] === q.correct) {
            btn.className += "bg-emerald-500 border-emerald-600 text-white shadow-xs";
          } else {
            btn.className += "bg-rose-500 border-rose-600 text-white shadow-xs";
          }
        } else {
          if (idx === currentIdx) {
            btn.className += "bg-indigo-50 border-indigo-600 text-indigo-700 ring-2 ring-indigo-600 shadow-xs";
          } else {
            btn.className += "bg-zinc-100 border-zinc-200 text-zinc-700 hover:bg-zinc-200";
          }
        }
      });
    }
  </script>

</body>
</html>
